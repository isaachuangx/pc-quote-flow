[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-quote-flow"
version = "0.1.0"
description = "Windows 本地装机报价流转工具（增值税底价/利润率报价、三种隔离导出、审批留痕、采购回写）"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
